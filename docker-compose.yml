services:
  redis-cache:
    image: redis:alpine
    ports:
      - "6379:6379"

  security-app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - redis-cache
    # 🌟 ENVIRONMENT OVERRIDE BLOCK
    # This automatically wipes the Upstash credentials ONLY inside Docker!
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_TLS=false